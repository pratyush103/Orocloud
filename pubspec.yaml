name: orocloud
description: "Cloud Based Storage Solution"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9  # For SVG icons (e.g., Google logo)
  google_fonts: ^6.2.1  # Optional: If you want custom fonts

  # Authentication & Storage
  supabase_flutter: ^2.8.3
  shared_preferences: ^2.5.2

  # Document Scanning
  cunning_document_scanner: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Asset Management (Add Google logo or other images)
  assets:
    - assets/google_logo.png  # Ensure the image exists in the assets folder


